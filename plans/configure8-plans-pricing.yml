specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Configure8
providerId: configure8
generated: '2026-09-05'
method: searched
source: https://configure8.io/pricing
created: '2026-05-04'
modified: '2026-09-05'
supersedes: >-
  A generated scaffold dated 2026-05-04 that invented a three-tier Free / Professional /
  Enterprise structure with 1,000 and 100,000 request monthly quotas and 10 / 100 / 1000
  requests-per-minute limits. None of those tiers, quotas or limits exist. configure8
  publishes exactly two plans and prices them per user per year, and publishes no request
  quota at all. Replaced in full with what the pricing page states.
description: >-
  configure8 publishes a two-tier price list — Free and Enterprise — priced per user per
  year, not per API call. There is no metered API pricing, no request quota and no overage
  rate anywhere on the page. The single most important fact for an API consumer is that API
  access is an Enterprise-only feature: the Free tier's row for "API Access" reads "No".
plan_count: 2
pricing_model: per-user subscription
metered_api_pricing: false
plans:
- id: configure8-free
  name: Free
  type: freemium
  price: '0.00'
  currency: USD
  billing_period: year
  billing_unit: per user
  price_note: '$0 / year per user'
  api_access: false
  api_access_note: >-
    The pricing table's "Enterprise Features > API Access" row reads "No" for Free. The
    Deployment API row also reads "No". A Free-tier account cannot call the Public API.
  limits:
  - name: Catalog users
    value: unlimited
  - name: Catalog items
    value: unlimited up to data cap
  - name: Integrations
    value: unlimited
  - name: Custom integrations
    value: not available
  - name: Scorecards users
    value: up to 10
  - name: Scorecards metrics
    value: unlimited
  - name: Deployment API
    value: 'no'
  - name: Self-Serve Actions users
    value: up to 10
  - name: Self-Serve Actions monthly volume
    value: limited
  - name: Self-Serve Actions action types
    value: unlimited
  - name: Monthly tracked cloud costs
    value: up to $7,500
  - name: RBAC
    value: 'no'
  - name: Audit log
    value: 'no'
  - name: Sign-in options
    value: Sign in with Google, email
  - name: Data retention
    value: limited
  - name: Usage reports
    value: 'no'
  - name: Hosting
    value: SaaS
  - name: Support
    value: community
- id: configure8-enterprise
  name: Enterprise
  type: enterprise
  price: '228.00'
  currency: USD
  billing_period: year
  billing_unit: per user
  price_note: >-
    "$228 / year per user — Equivalent to $19 / month per user (17% discount)". Available
    month-to-month or annual; monthly is billed every 30 days in arrears, annual is prepaid
    at the start of the term. Billing begins after a free trial. The page also states a
    floor: "Have fewer than ~50 engineers? configure8 starts at just $1,000 per month".
  api_access: true
  limits:
  - name: Catalog users
    value: unlimited
  - name: Catalog items
    value: unlimited
  - name: Integrations
    value: unlimited
  - name: Custom integrations
    value: built to suit (additional fee if not on roadmap)
  - name: Scorecards users
    value: unlimited
  - name: Scorecards metrics
    value: unlimited plus custom
  - name: Deployment API
    value: unlimited
  - name: Self-Serve Actions users
    value: unlimited
  - name: Self-Serve Actions monthly volume
    value: unlimited
  - name: Self-Serve Actions action types
    value: unlimited
  - name: Monthly tracked cloud costs
    value: unlimited
  - name: API access
    value: 'yes'
  - name: RBAC
    value: 'yes'
  - name: Audit log
    value: 'yes'
  - name: Sign-in options
    value: SSO, Sign in with Google, email
  - name: Data retention
    value: unlimited
  - name: Usage reports
    value: 'yes'
  - name: Hosting
    value: SaaS or on-premise (additional fees possible depending on support scope)
  - name: Support
    value: white glove support and success
discounts:
- audience: volume
  terms: contact sales for volume-based discounts above 300 users
- audience: self-hosting
  terms: contact sales for self-hosted pricing
- audience: non-profits, open-source projects and educational institutions
  terms: heavily discounted pricing on request
notes:
- No request quota, no rate limit and no overage price appears anywhere on the pricing page.
- Free trial is offered before Enterprise billing begins; no trial length is published.
