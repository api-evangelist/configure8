    delete:
      operationId: SCIMController_deleteGroup
      summary: SCIM controller delete group
      description: Delete a SCIM group
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '204':
          description: ''
        '400':
          description: Returned when request can not be processed
