      security:
      - bearer: []
components:
  schemas:
    SCIMGroupCreateDto:
      type: object
      properties:
        schemas:
          type: array
          description: SCIM group create schemas
          items:
            type: string
            enum:
            - urn:ietf:params:scim:schemas:core:2.0:User
            - urn:ietf:params:scim:schemas:core:2.0:Group
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
            - urn:ietf:params:scim:api:messages:2.0:Error
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
            - urn:ietf:params:scim:schemas:core:2.0:ResourceType
        displayName:
          type: string
          description: SCIM group name
        members:
          description: SCIM group members
          type: array
          items:
            $ref: '#/components/schemas/SCIMGroupMemberDto'
      required:
      - schemas
      - displayName
      - members
    SCIMUserPatchBodyDto:
      type: object
      properties:
        schemas:
          description: Patch operation schemas
          type: array
          items:
            type: string
        Operations:
          description: Patch operation list
          type: array
          items:
            type: string
      required:
      - schemas
      - Operations
    SCIMSchemaMemberDto:
      type: object
      properties:
        value:
          type: string
          description: The value of an attribute.
        $ref:
          type: string
          description: The URI of a resource.
        display:
          type: string
          description: The displayName of a resource.
      required:
      - value
      - $ref
      - display
    SCIMGroupMemberDto:
      type: object
      properties:
        value:
          type: string
          description: SCIM group member id
        $ref:
          type: string
          description: SCIM group member API URL
        display:
          type: string
          description: SCIM group member name
      required:
      - value
      - $ref
      - display
    SCIMSchemaBulk:
      type: object
      properties:
        supported:
          type: boolean
          description: Indicates whether or not the operation is supported.
        maxOperations:
          type: number
          description: The maximum number of operations.
        maxPayloadSize:
          type: number
          description: The maximum payload size in bytes.
      required:
      - supported
      - maxOperations
      - maxPayloadSize
    SCIMSchemaPatchDto:
      type: object
      properties:
        supported:
          type: boolean
          description: Indicates whether or not the operation is required.
      required:
      - supported
    SCIMCreateUserDto:
      type: object
      properties:
        schemas:
          type: array
          description: SCIM user create schemas
          items:
            type: string
            enum:
            - urn:ietf:params:scim:schemas:core:2.0:User
            - urn:ietf:params:scim:schemas:core:2.0:Group
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
            - urn:ietf:params:scim:api:messages:2.0:Error
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
            - urn:ietf:params:scim:schemas:core:2.0:ResourceType
        externalId:
          type: string
          description: SCIM external user id
        userName:
          type: string
          description: SCIM username
        name:
          description: SCIM user name details
          allOf:
          - $ref: '#/components/schemas/SCIMUserNameDto'
        displayName:
          type: string
          description: SCIM user display name
        active:
          type: boolean
          description: SCIM user active status
        emails:
          description: SCIM user emails
          type: array
          items:
            $ref: '#/components/schemas/SCIMUserEmailDto'
        groups:
          description: SCIM user groups
          type: array
          items:
            $ref: '#/components/schemas/SCIMUserGroupDto'
      required:
      - schemas
      - externalId
      - userName
      - name
      - displayName
      - active
      - emails
      - groups
    SCIMGroupListDto:
      type: object
      properties:
        schemas:
          type: array
          description: SCIM group create schemas
          items:
            type: string
            enum:
            - urn:ietf:params:scim:schemas:core:2.0:User
            - urn:ietf:params:scim:schemas:core:2.0:Group
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
            - urn:ietf:params:scim:api:messages:2.0:Error
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
            - urn:ietf:params:scim:schemas:core:2.0:ResourceType
        totalResults:
          type: number
          description: Total result number
        startIndex:
          type: number
          description: List start index
        itemsPerPage:
          type: number
          description: Items per page
        Resources:
          description: SCIM group list
          allOf:
          - $ref: '#/components/schemas/SCIMGroupDto'
      required:
      - schemas
      - totalResults
      - startIndex
      - itemsPerPage
      - Resources
    SCIMSchemaMetaDto:
      type: object
      properties:
        resourceType:
          type: string
          description: The resource's type. This value is always "Schema".
        created:
          type: string
          description: When this schema created.
        lastModified:
          type: string
          description: When this schema last modified.
        version:
          type: string
          description: The schema's version. This value is REQUIRED.
        location:
          type: string
          description: The schema's HTTP-addressable URL relative to the Base URL of the service provider, e.g., "/Schemas/urn:ietf:params:scim:schemas:core:2.0:User". This value is REQUIRED.
    SCIMGroupDto:
      type: object
      properties:
        schemas:
          type: array
          description: SCIM group create schemas
          items:
            type: string
            enum:
            - urn:ietf:params:scim:schemas:core:2.0:User
            - urn:ietf:params:scim:schemas:core:2.0:Group
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
            - urn:ietf:params:scim:api:messages:2.0:Error
            - urn:ietf:params:scim:api:messages:2.0:PatchOp
            - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
            - urn:ietf:params:scim:schemas:core:2.0:ResourceType
        displayName:
          type: string
          description: SCIM group name
        members:
          description: SCIM group members
          type: array
          items:
            $ref: '#/components/schemas/SCIMGroupMemberDto'
        id:
          type: string
          description: SCIM group id
        meta:
          description: SCIM group meta
          allOf:
          - $ref: '#/components/schemas/SCIMGroupMetaDto'
      required:
      - schemas
      - displayName
      - members
      - id
      - meta
    ScimSchemaUserDto:
      type: object
      properties:
        schemas:
          type: array
          description: The list of supported schemas for the resource type. The value must be one of the URIs listed in the Schemas section.
          items:
            type: string
            enum:
            - urn:ietf:params:scim:schemas:core:2.0:User
            - urn:ietf:params:scim:schemas:core:2.0:Group
            - urn:ietf:params:scim:api:messages:2.0:ListResponse
            - urn:ietf:params:scim:api:messages:2.0:Error
