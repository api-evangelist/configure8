  /public/v2/scim/Groups/{id}:
    get:
      operationId: SCIMController_getGroup
      summary: Get SCIM group
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
