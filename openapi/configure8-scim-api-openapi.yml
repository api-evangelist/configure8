          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
      tags:
      - SCIM
      security:
      - bearer: []
    patch:
      operationId: SCIMController_patchGroup
      summary: SCIM controller patch group
      description: Patch a SCIM group. Supports add, remove, and replace members or replace group name
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMGroupPatchBodyDto'
      responses:
        '204':
          description: Group patched successfully
        '400':
          description: Returned when request body is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '404':
          description: Returned when group is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '500':
