      - bearer: []
    put:
      operationId: SCIMController_putGroup
      summary: Updates group membership or group name
      description: Update a SCIM group
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMGroupUpdateDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMGroupDto'
        '400':
          description: Returned when request body is not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '401':
          description: Unauthorized
          content:
