  /public/v2/scim/ServiceProviderConfig:
    get:
      operationId: SCIMController_getServiceProviderConfig
      summary: Get SCIM service provider configuration
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimSchemaServiceProviderConfigDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
      tags:
      - SCIM
      security:
      - bearer: []
  /public/v2/scim/ResourceTypes:
    get:
      operationId: SCIMController_getResourceTypes
      summary: Get SCIM ResourceTypes schema
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
