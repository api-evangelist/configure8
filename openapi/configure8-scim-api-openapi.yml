              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
      tags:
      - SCIM
      security:
      - bearer: []
  /public/v2/scim/Schemas:
    get:
      operationId: SCIMController_getSchemas
      summary: Get array of all SCIM SCHEMAS
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ScimSchemaUserDto'
                - $ref: '#/components/schemas/ScimSchemaGroupDto'
                - $ref: '#/components/schemas/ScimSchemaServiceProviderConfigDto'
                - type: array
                  items:
                    $ref: '#/components/schemas/ScimResourceTypeDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '403':
