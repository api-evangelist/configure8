        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '403':
          description: Forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '404':
          description: Returned when group is not found
          content:
            application/json:
              schema:
