          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '404':
          description: Returned when group is not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMErrorDto'
      tags:
      - SCIM
