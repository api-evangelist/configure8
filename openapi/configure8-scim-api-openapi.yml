  /public/v2/scim/Schemas/{schema}:
    get:
      operationId: SCIMController_getSchema
      summary: Get SCIM schema by schema id
      parameters:
      - name: schema
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ScimSchemaUserDto'
                - $ref: '#/components/schemas/ScimSchemaGroupDto'
                - $ref: '#/components/schemas/ScimSchemaServiceProviderConfigDto'
                - type: array
                  items:
                    $ref: '#/components/schemas/ScimResourceTypeDto'
