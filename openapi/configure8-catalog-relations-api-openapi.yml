paths:
  /catalog/relations:
    get:
      tags:
      - Catalog Relations
      summary: List catalog relations
      operationId: listCatalogRelations
      parameters:
      - name: sourceId
        in: query
        schema:
          type: string
      - name: targetId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Relation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relation'
    post:
      tags:
      - Catalog Relations
      summary: Create a relation between entities
      operationId: createCatalogRelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Relation'
      responses:
        '201':
          description: Relation created
  /catalog/relations/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      tags:
      - Catalog Relations
      summary: Delete a catalog relation
      operationId: deleteCatalogRelation
      responses:
        '204':
          description: Deleted
