paths:
  /public/v1/catalog/entities:
    post:
      operationId: CatalogEntityController_getCatalogEntities
      summary: Get catalog entities filtered by query
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogEntityQueryDto'
      responses:
        '200':
          description: ''
