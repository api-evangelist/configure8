components:
  schemas:
    CreateCatalogApplicationDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the entity
        description:
          type: string
          description: Description of the entity
        tags:
          description: Tags to add to the entity
          type: array
          items:
            type: string
        links:
          description: List of URLs linked to this entity
          type: array
          items:
            $ref: '#/components/schemas/MetadataLinkDto'
        metaTags:
          description: List of metadata tags linked to this entity
          type: array
          items:
            $ref: '#/components/schemas/MetadataTagDto'
        permissions:
          type: object
          description: "List of permissions linked to this entity. The 'permissions' property is an optional object where the keys can represent either user identifier or team identifier, \n    and the value is array of the permissions associated with each user or team."
          additionalProperties:
            type: array
            items:
              type: string
              enum:
              - read
              - create
              - modify
              - delete
              - inherit
              - execute
        generalAccess:
          type: array
          description: Entity visibility control. By default it is set to a default access control on organization level
          items:
            type: string
            enum:
            - read
            - inherit
      required:
      - name
    CatalogEntitiesSearchResultDto:
      type: object
      properties:
        totalFound:
          type: number
          description: Total elements found
        pageNumber:
          type: number
        pageSize:
          type: number
        items:
          description: Found catalog entities
          type: array
          items:
            $ref: '#/components/schemas/CatalogEntityDto'
      required:
      - totalFound
      - pageNumber
      - pageSize
      - items
    CreateCatalogServiceDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the entity
        description:
          type: string
          description: Description of the entity
        tags:
          description: Tags to add to the entity
          type: array
          items:
            type: string
        links:
          description: List of URLs linked to this entity
          type: array
          items:
            $ref: '#/components/schemas/MetadataLinkDto'
        metaTags:
          description: List of metadata tags linked to this entity
          type: array
          items:
            $ref: '#/components/schemas/MetadataTagDto'
        permissions:
          type: object
          description: "List of permissions linked to this entity. The 'permissions' property is an optional object where the keys can represent either user identifier or team identifier, \n    and the value is array of the permissions associated with each user or team."
          additionalProperties:
            type: array
            items:
              type: string
              enum:
              - read
              - create
              - modify
              - delete
              - inherit
              - execute
        generalAccess:
          type: array
          description: Entity visibility control. By default it is set to a default access control on organization level
          items:
            type: string
            enum:
            - read
            - inherit
        repositoryId:
          type: string
          description: The ID of the repository entity to assign to the service
        repositoryPath:
          type: string
          description: The path of the repository
        languages:
          description: The languages that this service uses
          type: array
          items:
            type: string
        lifecycle:
          type: string
          description: The lifecycle of the service
        applications:
          description: The ID of the application entities linked to this service
          type: array
          items:
            type: string
        templateId:
          type: string
          description: The ID of the template that this entity is based on
      required:
      - name
    CatalogEntityQueryDto:
      type: object
      properties:
        propertyFilters:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/CatalogSimplePropertyFilter'
            - $ref: '#/components/schemas/CatalogCompoundPropertyFilter'
          description: "Filters for matching properties' values:\n    Can be SIMPLE and COMPOUND.\n    SIMPLE is a key-value pair.\n    COMPOUND is a set of key-value pairs combined with OR or AND operator"
        searchTerms:
          type: string
          description: Term to search by
        searchOnlyByName:
          type: boolean
          default: false
          description: Perform search only by entity name. By default search will be performed considering all text properties
        types:
          type: array
          description: Catalog entity types to filter by
          items:
            type: string
            enum:
            - application
            - system
            - service
            - resource
            - environment
            - person
            - api
            - repository
            - library
            - manifest
            - team
            - base
        includeProperties:
          description: "Entity properties that will be returned in result. \n  By default all entity properties are included in response. \n  If includeProperties is passed, regardless of which properties are specified, 'id' and 'type' fields will be always included"
          type: array
          items:
            type: string
        pageNumber:
          type: number
          default: 0
        pageSize:
          type: number
          default: 20
        sort:
          description: Sort entities by property in ASC or DESC order
          allOf:
          - $ref: '#/components/schemas/CatalogEntitySort'
    UpdateCatalogServiceDto:
      type: object
      properties:
        name:
          type: string
          description: Catalog entity name, should be unique, not updatable for discovery created catalog entity
        description:
          type: string
          description: Catalog entity description, not updatable for discovery created catalog entity
        tags:
          description: Tags to add to the entity, replaces the existing list
          type: array
          items:
            type: string
        links:
          description: List of URLs linked to this entity, replaces the existing list
          type: array
          items:
            $ref: '#/components/schemas/MetadataLinkDto'
        metaTags:
          description: List of metadata tags linked to this entity, replaces the existing list
          type: array
          items:
            $ref: '#/components/schemas/MetadataTagDto'
        permissions:
          type: object
          description: "List of permissions linked to this entity. The 'permissions' property is an optional object where the keys can represent either user identifier or team identifier, \n    and the value is array of the permissions associated with each user or team."
          additionalProperties:
            type: array
            items:
              type: string
              enum:
              - read
              - create
              - modify
              - delete
              - inherit
              - execute
        permissionsPatterns:
          type: array
          items:
            type: string
        generalAccess:
          type: array
          description: Entity visibility control. By default it is set to a default access control on organization level
          items:
            type: string
            enum:
            - read
            - inherit
        repositoryPath:
          type: string
          description: The path of the repository
        languages:
          description: The languages that this service uses
          type: array
          items:
            type: string
        lifecycle:
          type: string
          description: The lifecycle of the service
        templateId:
          type: string
          description: The ID of the template that this service is based on
    CatalogSystemDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        orgId:
          type: string
        type:
          type: string
          enum:
          - application
          - system
          - service
          - resource
          - environment
          - person
          - api
          - repository
          - library
          - manifest
          - team
          - base
          description: Catalog entity type
        description:
          type: string
          description: Catalog entity description
        tags:
          description: Catalog entity's tags
          type: array
          items:
            type: string
        metaTags:
          description: Catalog entity's metadata
          type: array
          items:
            $ref: '#/components/schemas/MetadataTagDto'
        links:
          description: Catalog entity's links
          type: array
          items:
            $ref: '#/components/schemas/MetadataLinkDto'
        parents:
          description: Catalog entity's parents
          type: array
          items:
            $ref: '#/components/schemas/EntityParentDto'
        createdBy:
          type: string
        lastChangedBy:
          type: string
        createDateTime:
          format: date-time
          type: string
        lastChangedDateTime:
          format: date-time
          type: string
        permissions:
          type: object
          description: "List of permissions linked to this entity. The 'permissions' property is an optional object where the keys can represent either user identifier or team identifier, \n    and the value is array of the permissions associated with each user or team."
          additionalProperties:
            type: array
            items:
              type: string
              enum:
              - read
              - create
              - modify
              - delete
              - inherit
              - execute
        generalAccess:
          type: array
          description: Entity visibility control. By default it is set to a default access control on organization level
          items:
            type: string
            enum:
            - read
            - inherit
      required:
      - id
      - name
      - orgId
      - type
    CatalogRepositoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        orgId:
          type: string
        type:
          type: string
          enum:
          - application
          - system
          - service
          - resource
          - environment
          - person
          - api
          - repository
          - library
          - manifest
          - team
          - base
          description: Catalog entity type
        description:
          type: string
          description: Catalog entity description
        tags:
          description: Catalog entity's tags
          type: array
          items:
            type: string
        metaTags:
          description: Catalog entity's metadata
          type: array
          items:
            $ref: '#/components/schemas/MetadataTagDto'
        links:
          description: Catalog entity's links
          type: array
          items:
            $ref: '#/components/schemas/MetadataLinkDto'
        parents:
          description: Catalog entity's parents
          type: array
          items:
            $ref: '#/components/schemas/EntityParentDto'
        createdBy:
          type: string
        lastChangedBy:
          type: string
        createDateTime:
          format: date-time
          type: string
        lastChangedDateTime:
          format: date-time
          type: string
        permissions:
          type: object
          description: "List of permissions linked to this entity. The 'permissions' property is an optional object where the keys can represent either user identifier or team identifier, \n    and the value is array of the permissions associated with each user or team."
          additionalProperties:
            type: array
            items:
              type: string
              enum:
              - read
              - create
              - modify
              - delete
              - inherit
              - execute
        generalAccess:
          type: array
          description: Entity visibility control. By default it is set to a default access control on organization level
          items:
            type: string
            enum:
            - read
            - inherit
        url:
          type: string
        contributors:
          type: array
          items:
            type: string
        languages:
          type: array
