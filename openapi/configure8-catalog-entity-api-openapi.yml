            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntitiesSearchResultDto'
        '400':
          description: Returned when request body is not valid
      tags:
      - Catalog Entity
  /public/v1/catalog/entities/{id}:
    get:
      operationId: CatalogEntityController_getCatalogEntityById
      summary: Get a catalog entity by id
      parameters:
      - name: id
        required: true
        in: path
        description: Unique id of catalog entity to return
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEntityDto'
        '404':
          description: Returned when catalog entity with specified id is not found
      tags:
      - Catalog Entity
    delete:
      operationId: CatalogEntityController_deleteCatalogEntityById
      summary: Delete the specified catalog entity
      parameters:
      - name: id
        required: true
        in: path
        description: Unique ID for given catalog entity.
        schema:
          type: string
      responses:
        '200':
          description: ''
        '404':
          description: The requested catalog entity does not exist in the organisation.
        '409':
          description: ''
      tags:
      - Catalog Entity
