servers:
- url: https://{tenant}.configure8.io/public/v1
  description: Configure8 SaaS tenant
  variables:
    tenant:
      default: app
      description: Configure8 tenant subdomain
security:
- apiKey: []
tags:
- name: Deployments
paths:
  /deployments:
    post:
      tags:
      - Deployments
      summary: Record a deployment
      operationId: recordDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deployment'
      responses:
        '201':
          description: Deployment recorded
components:
  schemas:
    Deployment:
      type: object
      properties:
        serviceId:
          type: string
        environmentId:
          type: string
        version:
          type: string
        status:
          type: string
        timestamp:
          type: string
          format: date-time
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Bearer/API token issued from the Configure8 UI; passed in the Authorization header
