description: >-
  configure8 publishes a dated product release-notes page ("Describes configure8 features,
  improvements, and bug fixes by release date"), grouped per release into New / Improvement
  / Fix. It is a product changelog, not an API changelog — API changes appear inside it as
  ordinary line items (for example "Add SSA endpoints in the Public API", "Remove Person
  Catalog endpoints from Public API") rather than in a separate breaking-change log.
