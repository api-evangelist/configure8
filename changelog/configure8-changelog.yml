- version: 2.157.0
  date: '2024-12-06'
  breaking: true
  breaking_note: >-
    "Remove Person Catalog endpoints from Public API" — an endpoint removal from the public
    surface, shipped as a line item under Fix with no deprecation notice, no Sunset header
    and no migration guidance. The harvested contract still carries
    POST /public/v1/catalog/entities/person and PATCH /public/v1/catalog/entities/person/{id},
    because that download was last regenerated before this release.
  additions:
  - Add data flexibility integration to the Self Service Actions
  - Add Query Builder integration to SCIM
  fixes:
  - Fix GitHub credential creation
  - Fix issue in the Sign-up form
  - Remove Person Catalog endpoints from Public API
  - Fix aggregation on the Scorecard Metric Results History
  - Fix count for the Scorecard Metric Results History
  - Fix sorting by Scorecard levels
  - Fix missed Repository hyperlink in the repositories table
