reachability:
  checked: '2026-09-05'
  findings:
  - host: app.configure8.io
    result: NXDOMAIN
    resolvers: [1.1.1.1, 8.8.8.8]
    significance: >-
      This is the documented API base host — the docs' own curl example is
      `curl https://app.configure8.io/public/v1/catalog/entities --header "Api-Key: my_api_key"` —
      and it is also the single host named as the scope of the responsible-disclosure
      program. It has no A or AAAA record. No call to the documented base URL can be made
      from the public internet today.
  - host: docs.configure8.io
    result: NXDOMAIN
    resolvers: [1.1.1.1, 8.8.8.8]
    significance: >-
      The documentation host the catalog previously pointed at. The same GitBook space is
      still reachable through the marketing site's reverse proxy at
      https://configure8.io/docs-sub/configure8-product-docs, which is what this repo now
      points at.
  - host: configure8.io / www.configure8.io
    result: HTTP 200, TLS 1.3, cert valid to 2026-11-06
    significance: marketing site and the proxied product documentation are live
  - host: configure8.readme.io
    result: HTTP 200
    significance: >-
      API reference, the downloadable OpenAPI, an llms.txt and a /.well-known/api-catalog
      are all live and served here
  - surface: https://github.com/Configure8inc
    result: HTTP 200, 2 public repositories, BOTH archived 2025-03-31
    repos: [configure8examples, c8-public-cloudformation-templates]
    significance: >-
      configure8examples is the repository the API documentation tells developers to clone
      for its six public-API examples; it is archived and therefore read-only.
  summary: >-
    Documentation, the API reference and the machine-readable contract are all still
    published and reachable. The application host that serves the API, and the docs host,
    are not resolvable, and the provider's public example code was archived in March 2025.
    Recorded as measurement; no conclusion is drawn here about the company's status.
