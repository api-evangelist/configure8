deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations_in_contract: 0
  evidence: >-
    No `deprecated: true` flag on any of the 71 operations in the harvested contract, no
    Sunset or Deprecation response header anywhere, and no deprecation policy page. The
    release notes show removal happening WITHOUT any of that: release 2.157.0 (2024-12-06)
    lists "Remove Person Catalog endpoints from Public API" as a bug-fix line item. A
    consumer of those endpoints had no advance signal, and the published OpenAPI still
    describes them.
sla:
  published: false
  evidence: >-
    The pricing page differentiates support modality (Free = Community; Enterprise =
    "White Glove Support + Success") but publishes no uptime commitment, no response-time
    target and no service credits. The Terms of Service are distributed as a PDF
    (https://configure8.io/tos.pdf) rather than as a linkable SLA.
status_page:
