method: derived
source: >-
  openapi/configure8-c8-public-api-openapi.json — $ref graph and id-reference fields across
  120 component schemas; entity taxonomy cross-checked against
  https://configure8.io/docs-sub/configure8-product-docs/reference/api-documentation/catalog-entity
description: >-
  configure8's data model is a catalog graph. Everything in it is a Catalog Entity of one of
  nine types, and the edges between entities are first-class Catalog Relations addressed by
  their own endpoints rather than by foreign keys on the entities. Scorecards, deployments,
  costs, module settings and metadata all hang off catalog entities. Every record in the
  system is scoped to an organization via orgId.
tenancy:
  field: orgId
  note: >-
    Carried on every persisted DTO — CatalogEntityDto, CatalogResourceDto, CatalogServiceDto,
    CatalogPersonDto, CatalogLibraryDto, CatalogRepositoryDto, CatalogEnvironmentDto,
    CatalogSystemDto, CatalogApplicationDto, CatalogManifestDto, CatalogBaseDto,
    CatalogEntityMetadataDto, TemplateDto, UserDto, ScheduleDto, ScorecardDto,
    ScorecardMetricDto, ScorecardMetricResultDto, ModuleSettingsDto, DeploymentDto,
    CredentialDto and ScimConfigDto. Ids are only meaningful inside one organization.
entities:
- name: CatalogEntity
  schema: CatalogEntityDto
  description: The base catalog record every specialised type extends.
  endpoints:
  - POST /public/v1/catalog/entities (query)
  - GET /public/v1/catalog/entities/{id}
  - DELETE /public/v1/catalog/entities/{id}
  subtypes:
  - 'Service'
  - 'Resource'
  - 'Person'
  - 'Repository'
  - 'Library'
  - 'Manifest'
  - 'Environment'
  - 'System'
  - 'Application'
  - 'Base'
