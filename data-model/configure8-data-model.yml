id_conventions:
  shape: opaque strings; no documented type prefix
  scope: organization (orgId)
  note: >-
    Unlike providers that prefix ids by type, configure8 ids carry no discriminator — the
    entity type is in the URL path, not the id. Release 2.156.0 records a "Fix duplicated
    IDs stored in DB" defect.
