specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Configure8
providerId: configure8
generated: '2026-09-05'
method: searched
source: >-
  https://configure8.io/docs-sub/configure8-product-docs/reference/api-documentation;
  https://configure8.io/pricing;
  openapi/configure8-c8-public-api-openapi.json
created: '2026-05-04'
modified: '2026-09-05'
supersedes: >-
  A generated scaffold dated 2026-05-04 that asserted X-RateLimit-Limit / -Remaining /
  -Reset / RateLimit-Policy response headers, a 429 on exhaustion, and per-tier limits of
  10 / 100 / 1000 requests per minute across Free / Professional / Enterprise tiers. None of
  that is published by configure8, and the "Professional" tier does not exist. Replaced with
  the measured absence.
description: >-
  configure8 publishes no rate limits. The API reference documents authentication, an error
  status-code table and pagination, and stops there — there is no throttling section, no
  quota, no burst allowance and no documented recovery behaviour. Neither the pricing page
  nor the plan comparison mentions request volume in any form; the plans are priced per
  user, not per call.
limit_count: 0
headers: {}
headers_note: >-
  No rate-limit response headers are documented, and none are declared on any of the 71
  operations in the harvested contract. Standard RateLimit-* and X-RateLimit-* headers do
  not appear in the specification at all. An agent has no runtime signal to read: it cannot
  learn its remaining budget, and it cannot learn when to retry.
exhaustion_status: null
exhaustion_status_note: >-
  429 is NOT among the status codes configure8 documents. The published table covers 400,
  401, 403, 404, 409, 422 and 5xx, and no operation in the contract declares a 429 response.
  Whether the service throttles at all — and what it returns if it does — is unknown from
  outside.
limits: []
observed: false
observed_note: >-
  Live observation was not possible. The documented base host app.configure8.io was NXDOMAIN
  when probed on 2026-09-05, so no unauthenticated response headers could be sampled, and
  API access is in any case an Enterprise-plan feature.
maintainers:
