description: >-
  configure8's ReadMe-hosted API reference exposes a Model Context Protocol endpoint at
  https://configure8.readme.io/mcp. A POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  with Accept: application/json, text/event-stream returns HTTP 401 and a JSON-RPC error
  {"code":-32001,"message":"Authorization required"} — a real MCP server that refuses
  anonymous introspection, not an HTML shell and not a 404. The tool list and inputSchemas
  therefore need an authenticated introspection pass; they are NOT recorded here, because
  we have not seen them.
deployment:
  mode: remote
  endpoint: https://configure8.readme.io/mcp
  auth: unknown
  verified: probed
  note: >-
    Auth challenge is a bare JSON-RPC 401 with no WWW-Authenticate header and no RFC 9728
    protected-resource metadata — /.well-known/oauth-protected-resource,
    /.well-known/oauth-protected-resource/mcp and /.well-known/oauth-authorization-server
    all 404 on this host — so the scheme (OAuth vs API key) could not be established from
    outside. Recorded as `unknown` rather than guessed.
platform_provided: true
platform_note: >-
  This endpoint is provided by ReadMe, the documentation platform configure8 runs its API
  reference on, rather than authored by configure8. It is served from a host configure8
  controls (configure8.readme.io, the project's own subdomain, linked as Documentation from
  configure8.io) and it scopes to configure8's own API reference, so it is a real agent
  surface for this provider — but it is platform-authored, and a docs-search surface is not
  the same thing as an MCP wrapper over the Public API itself.
